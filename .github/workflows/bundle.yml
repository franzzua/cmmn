# Builds public packages and stages them on npm when a version tag (v*) is pushed.
# Prerelease tags publish under their dist-tag: v3.0.0-beta-1 -> beta, v3.0.0-alpha-7 -> alpha.
# Staged versions are published after approval with 2FA:
#   yarn npm stage list
#   yarn npm stage approve <stageId>

name: Node.js Package

on:
  push:
    tags: [ 'v*' ]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --immutable
      - name: dist-tag
        id: dist
        run: |
          case "$GITHUB_REF_NAME" in
            *-beta*) echo "tag=beta" >> "$GITHUB_OUTPUT" ;;
            *-alpha*) echo "tag=alpha" >> "$GITHUB_OUTPUT" ;;
            *) echo "tag=latest" >> "$GITHUB_OUTPUT" ;;
          esac
      - run: yarn release --tag ${{ steps.dist.outputs.tag }} --staged
        env:
          # .yarnrc.yml publishes to the private registry by default
          YARN_NPM_PUBLISH_REGISTRY: https://registry.npmjs.org
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
